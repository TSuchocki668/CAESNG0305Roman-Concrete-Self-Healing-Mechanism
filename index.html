<script>
const titles = [
  "Intact Roman Concrete",
  "Crack Forms, Water Enters",
  "Dissolution Begins",
  "Crystal Seal"
];
const stepSubtitles = [
  "intact concrete",
  "crack and water",
  "dissolution",
  "crystal seal"
];
const captions = [
  "Roman concrete is a composite of volcanic ash (pozzolana), seawater, and aggregate, with lime-rich clasts containing reactive calcium compounds distributed throughout the matrix. These pale fragments were not fully mixed, a feature once mistaken for poor craftsmanship.",
  "When stress fractures the matrix, a crack opens and water enters from above. The crack becomes a conduit, carrying water down through the material toward embedded lime clasts.",
  "Water reaching a lime clast begins dissolving its surface. Calcium ions (Ca\u00B2\u207A) enter solution at the dissolving edge, creating a locally alkaline, calcium-rich environment within the crack.",
  "Dissolved calcium combines with carbonate in the water to precipitate calcium carbonate (calcite, CaCO\u2083). Crystals grow outward from the clast surface, bridging the crack with lateral and upward growth until the opening is sealed. The crack becomes the pathway for repair because water carries dissolved calcium into the damaged space, where new mineral crystals grow and seal the opening."
];

let cur = 0;

function render() {
  document.querySelectorAll('.sw-panel').forEach((p, i) => p.classList.toggle('active', i === cur));
  document.getElementById('sw-title').textContent = titles[cur];
  document.getElementById('sw-cap').textContent = captions[cur];
  document.getElementById('sw-step-lbl').textContent = 'Step ' + (cur + 1) + ' of 4, ' + stepSubtitles[cur];
  document.getElementById('sw-prev').disabled = cur === 0;
  document.getElementById('sw-next').textContent = cur === 3 ? 'Start Over \u2192' : 'Forward \u2192';

  const d = document.getElementById('sw-dots');
  d.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('button');
    b.style.cssText = 'display:inline-block;width:10px;height:10px;min-width:10px;min-height:10px;border-radius:50%;padding:0;margin:0;border:none;cursor:pointer;flex-shrink:0;box-sizing:border-box;background:' + (i === cur ? '#2C2C2A' : '#B4B2A9') + ';transition:background .2s;';
    b.setAttribute('aria-label', 'Step ' + (i + 1));
    b.onclick = () => goTo(i);
    d.appendChild(b);
  }
}

function swStep(dir) {
  if (cur === 3 && dir === 1) { goTo(0); return; }
  goTo(cur + dir);
}
function goTo(i) { cur = Math.max(0, Math.min(3, i)); render(); }
render();
</script>
